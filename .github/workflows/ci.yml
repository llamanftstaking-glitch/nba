name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env: { POSTGRES_USER: gizer, POSTGRES_PASSWORD: gizer_dev, POSTGRES_DB: gizer_nba_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gizer" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock && pip install --no-deps -e . && pip install pytest==9.2.0 ruff==0.17.6 pip-audit==2.7.3
      - run: ruff check gizer tests --select E9,F
      - run: pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.lock
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  # Builds both images. On a push to main it also publishes them to the GitHub Container Registry, tagged with
  # the full commit id; the server pulls exactly those when that commit is promoted to `production`
  # (scripts/auto-update.sh waits for this job like every other check). Pull requests build only.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/llamanftstaking-glitch/nba   # must stay lowercase; scripts/lib-images.sh uses the same
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the container registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: ${{ env.PUBLISH == 'true' }}
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=gizer-nba-api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: ${{ env.PUBLISH == 'true' }}
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=gizer-nba-web
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
