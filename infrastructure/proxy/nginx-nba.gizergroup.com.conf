# Site file for the EXISTING host reverse proxy on Server M (add as a new file; do not edit other sites).
# TLS: issue with the proxy's existing ACME tooling, e.g. `certbot --nginx -d nba.gizergroup.com`.
server {
    listen 80;
    server_name nba.gizergroup.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name nba.gizergroup.com;
    ssl_certificate     /etc/letsencrypt/live/nba.gizergroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nba.gizergroup.com/privkey.pem;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:3410;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # single trusted hop; overwrite, never append
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
