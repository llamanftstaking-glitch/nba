[project]
name = "gizer-nba"
version = "0.1.0"
description = "GIZER NBA quantitative research platform (research, simulation and paper testing only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "httpx==0.28.1",
  "numpy==2.5.5",
  "pandas==3.1.1",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "argon2-cffi==25.1.0",
  "tzdata==2026.6",
]
[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]
[project.scripts]
gizer = "gizer.cli:main"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["gizer*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
