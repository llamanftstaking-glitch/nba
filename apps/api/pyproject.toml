[project]
name = "gizer-nba"
version = "0.1.0"
description = "GIZER NBA quantitative research platform (research, simulation and paper testing only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "httpx==0.28.1",
  "numpy==2.2.1",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "scikit-learn==1.6.0",
  "argon2-cffi==23.1.0",
  "tzdata==2024.2",
]
[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]
[project.scripts]
gizer = "gizer.cli:main"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["gizer*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
